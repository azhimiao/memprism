# Install after `certbot certonly --webroot -w /var/www/html -d test.memprism.com` has issued the certificate:
#         sudo cp nginx-test.memprism.com.conf /etc/nginx/sites-available/test.memprism.com
#         sudo ln -sf /etc/nginx/sites-available/test.memprism.com /etc/nginx/sites-enabled/
# Certificate paths below match Let's Encrypt defaults for test.memprism.com.

server {
    listen 80;
    listen [::]:80;
    server_name test.memprism.com;

    # Webroot renewals keep working after the HTTPS redirect is installed.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.memprism.com;

    ssl_certificate /etc/letsencrypt/live/test.memprism.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.memprism.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    access_log off;
    error_log /var/log/nginx/aml-test-memprism-error.log warn;

    location = /health {
        proxy_pass http://127.0.0.1:28717;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # The platform allows a single Add or Search up to 30 minutes.
    location = /add {
        proxy_pass http://127.0.0.1:28717;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location = /search {
        proxy_pass http://127.0.0.1:28717;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
