# First-issue only: serves the ACME webroot for test.memprism.com before a certificate exists.
# Replace with nginx-test.memprism.com.conf once certbot has issued the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name test.memprism.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
